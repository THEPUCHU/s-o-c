    // --- CANVAS VECTOR ANIMATION COMPONENT (ACTIVE ONLY DURING ATTACK/DEFENSE) ---
    function AttackVectorCanvas({ isInvestigating, isComplete, mitigationOutcome, attackerIp, targetHost }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const width = canvas.parentElement.clientWidth || 700;
        const height = 150;
        canvas.width = width;
        canvas.height = height;

        const nodes = [
          { id: 'attacker', label: `Attacker IP (${attackerIp || '194.26.29.112'})`, x: width * 0.12, y: height * 0.5, color: '#ff2a5f' },
          { id: 'firewall', label: 'Perimeter Firewall', x: width * 0.38, y: height * 0.5, color: isComplete ? '#00f2fe' : '#fbbf24' },
          { id: 'target', label: `Endpoint (${targetHost || 'WS-EXEC-04'})`, x: width * 0.65, y: height * 0.5, color: isComplete ? '#00e676' : '#64748b' },
          { id: 'vault', label: 'Core Data Vault', x: width * 0.88, y: height * 0.5, color: '#38bdf8' }
        ];

        // Particles ONLY created/updated when isInvestigating === true
        const particles = [];
        if (isInvestigating) {
          for (let i = 0; i < 22; i++) {
            particles.push({
              progress: Math.random(),
              speed: 0.009 + Math.random() * 0.012,
              size: 3
            });
          }
        }

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          // Draw Network Connection Lines
          ctx.beginPath();
          ctx.moveTo(nodes[0].x, nodes[0].y);
          ctx.lineTo(nodes[1].x, nodes[1].y);
          ctx.lineTo(nodes[2].x, nodes[2].y);
          ctx.lineTo(nodes[3].x, nodes[3].y);
          ctx.strokeStyle = 'rgba(79, 172, 254, 0.25)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);

          // Shield Barrier when Mitigated
          if (isComplete && mitigationOutcome === 'SUCCESS') {
            ctx.beginPath();
            ctx.arc(nodes[1].x, nodes[1].y, 26, 0, Math.PI * 2);
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(0, 242, 254, 0.12)';
            ctx.fill();
            ctx.stroke();
          }

          // Render Moving Particles ONLY when isInvestigating is active
          if (isInvestigating) {
            particles.forEach(p => {
              p.progress += p.speed;
              if (p.progress > 1) p.progress = 0;

              let currentX, currentY, dotColor;

              if (p.progress < 0.4) {
                const t = p.progress / 0.4;
                currentX = nodes[0].x + (nodes[1].x - nodes[0].x) * t;
                currentY = nodes[0].y;
                dotColor = '#ff2a5f';
              } else if (p.progress < 0.75) {
                const t = (p.progress - 0.4) / 0.35;
                currentX = nodes[1].x + (nodes[2].x - nodes[1].x) * t;
                currentY = nodes[1].y;
                dotColor = isComplete && mitigationOutcome === 'SUCCESS' ? '#00e676' : '#ff2a5f';
              } else {
                const t = (p.progress - 0.75) / 0.25;
                currentX = nodes[2].x + (nodes[3].x - nodes[2].x) * t;
                currentY = nodes[2].y;
                dotColor = isComplete && mitigationOutcome === 'SUCCESS' ? '#00e676' : '#ff2a5f';
              }

              ctx.beginPath();
              ctx.arc(currentX, currentY, p.size, 0, Math.PI * 2);
              ctx.fillStyle = dotColor;
              ctx.fill();
            });

            animationFrameId = requestAnimationFrame(render);
          } else {
            // Draw static nodes in IDLE / COMPLETE state
            nodes.forEach(node => {
              ctx.beginPath();
              ctx.arc(node.x, node.y, 15, 0, Math.PI * 2);
              ctx.fillStyle = '#0b101d';
              ctx.strokeStyle = node.color;
              ctx.lineWidth = 2;
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = '#94a3b8';
              ctx.font = '600 11px Plus Jakarta Sans';
              ctx.textAlign = 'center';
              ctx.fillText(node.label, node.x, node.y + 28);
            });
          }
        };

        render();

        return () => {
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [isInvestigating, isComplete, mitigationOutcome, attackerIp, targetHost]);

      return (
        <div className="w-full bg-[#090d19] rounded-xl p-3 border border-slate-800 flex flex-col gap-1">

            </span>
            <span className="text-[10px] text-slate-400 font-sans">
              {isInvestigating ? '● Animation Active (Attack/Defense in Execution)' : isComplete ? '✓ Pipeline Idle (Shielded)' : '● Standby Idle'}
            </span>
          </div>
          <canvas ref={canvasRef} className="w-full h-[150px] rounded-lg" />
        </div>
      );
    }

      const [activeAgentId, setActiveAgentId] = useState('coordinator');
      const [currentPhase, setCurrentPhase] = useState('STANDBY');

      const [isBenchmarkOpen, setIsBenchmarkOpen] = useState(false);
      const [actionStatuses, setActionStatuses] = useState({});

      useEffect(() => {
        setCustomHost(activeScenario.initialAlert.host);
        setCustomIp(activeScenario.initialAlert.srcIp);
        setSoarActions(activeScenario.recommendedActions);
        setActionStatuses({});

      const toggleLogExpand = (logId) => {
        setExpandedLogs(prev => ({
          ...prev,
          [logId]: !prev[logId]

      };

      // --- INITIATE ATTACK ENGINE ---
      const handleInitiateAttack = async (simulateFailure = false) => {
        setLogs([]);
        setExpandedLogs({});
        setActionStatuses({});
        setIsComplete(false);
        setIsReportOpen(false);
        setIsInvestigating(true);
        setMitigationOutcome(simulateFailure ? 'FAILED' : 'SUCCESS');

        const targetIp = customIp || activeScenario.initialAlert.srcIp;
        const targetHost = customHost || activeScenario.initialAlert.host;

        const addLog = (agentId, phase, title, detail, toolOutput = null) => {
          setLogs(prev => [...prev, {
            id: 'STEP-' + Date.now() + '-' + Math.floor(Math.random()*10000),
            timestamp: new Date().toLocaleTimeString(),
            agentId, phase, title, detail, toolOutput
          }]);
          setActiveAgentId(agentId);
          setCurrentPhase(phase);
        };

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        // Step 1: Coordinator
        addLog('coordinator', 'Ingestion', 'Alert Ingestion & Task Decomposition', `FORTIS ingested alert telemetry targeting asset [${targetHost}] from attacker IP [${targetIp}]. Dispatched sub-tasks to specialized domain agents.`);
        await sleep(executionSpeed);

        // Step 2: Threat Intel
        addLog('threat_intel', 'Enrichment', 'Threat Intelligence Reputation Query', `Queried VirusTotal & AbuseIPDB APIs. Verdict: MALICIOUS (68/90 security vendors). AbuseIPDB Confidence Score: 99% (Known C2 Botnet).`, { tool: 'VirusTotal API', positives: 68, total: 90, ip: targetIp, geolocation: 'Eastern Europe' });
        await sleep(executionSpeed + 100);

        // Step 3: Log Analysis
        addLog('log_analysis', 'Log Correlation', 'SIEM & Sigma Pattern Matching', `Correlated SIEM event streams on host [${targetHost}]. Matched 4 Sigma Rules: proc_creation_win_powershell_encoded, credential_dumping_lsass, outbound_c2_connection.`, { tool: 'Sigma Correlation Engine', matchedRules: 4, eventId: 4624 });
        await sleep(executionSpeed);

        // Step 4: Malware Analysis
        addLog('malware_analysis', 'Binary Inspection', 'YARA Signature & Memory Entropy Scan', `Scanned process payload memory. Matched YARA Rule: apt_win_blackcat_ransomware. Entropy score: 7.94 (Encrypted binary execution).`, { tool: 'YARA Core Engine', ruleMatched: 'apt_win_blackcat_ransomware', entropy: 7.94 });
        await sleep(executionSpeed);

        // Step 5: Cloud Security
        addLog('cloud_security', 'Cloud Audit', 'CloudTrail & IAM Security Audit', `Audited IAM Access Logs: Detected unauthorized session tokens and AdministratorAccess policy attachment.`);
        await sleep(executionSpeed - 100);

        // Step 6: Coordinator Consensus
        addLog('coordinator', 'Consensus', 'Multi-Agent Threat Consensus Formulated', `Synthesized evidence across 5 agents. Threat Confidence Rating: 98.8% (CRITICAL). Primary attack classification: ${activeScenario.category}.`);
        await sleep(executionSpeed + 100);

        // Step 7: Compliance Audit
        addLog('compliance', 'Regulatory Audit', 'Regulatory & Compliance Impact Assessment', `Assessed regulatory breach penalties: GDPR Article 33 72-Hour Breach Notification triggered. PCI-DSS CDE isolation enforced.`);
        await sleep(executionSpeed - 100);

        // Step 8: SOAR Action
        if (!simulateFailure) {
          addLog('incident_response', 'SOAR Containment', 'Automated SOAR Countermeasures Executed', `FORTIS executed automated response playbook: (1) Blocked IP ${targetIp} on Perimeter Firewall. (2) Issued EDR host isolation for ${targetHost}.`, {
            countermeasuresExecuted: [
              `Firewall Block Rule: IP ${targetIp}`,
              `EDR Host Isolation: Endpoint ${targetHost}`,
              `OAuth Session Token Revocation`
            ]
          });
          setActionStatuses({
            'ACT-01': 'AUTOMATED_EXECUTED',
            'ACT-02': 'AUTOMATED_EXECUTED',
            'ACT-11': 'AUTOMATED_EXECUTED',
            'ACT-21': 'AUTOMATED_EXECUTED',
          });
        } else {
          addLog('incident_response', 'SOAR Failure', 'SOAR Containment Timeout', `Perimeter rule enforcement timed out. IP ${targetIp} bypassed containment.`);
        }
        await sleep(executionSpeed);

        // Step 9: HITL Intercept
        addLog('human_approval', 'HITL Guardrail', 'High-Risk Action Queued for Human Approval', `Core Database Segment Isolation (Risk Score: 92%) intercepted by FORTIS HITL governance guardrail.`);
        await sleep(300);

        setIsInvestigating(false);
        setIsComplete(true);
        setActiveAgentId('coordinator');
        setCurrentPhase(simulateFailure ? 'UNCONTAINED' : 'MITIGATED');

        // Automatically open the Executive Incident Report Modal
        setIsReportOpen(true);
      };

      const handleAuthorizeHitl = (actionId) => {
        setActionStatuses(prev => ({
          ...prev,
          [actionId]: 'AUTHORIZED_BY_HUMAN'
        }));
      };

      return (
        <div className="min-h-screen bg-[#05070e] text-slate-100 font-sans flex flex-col">
          
          {/* HEADER BAR */}
          <header className="border-b border-slate-800 bg-[#090d19]/95 sticky top-0 z-40 px-6 py-3 shadow-lg backdrop-blur-md">
            <div className="max-w-[1700px] mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
